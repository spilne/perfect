name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "packages/core/examples/**"
      - "packages/http/examples/**"
      - "packages/http-otel/examples/**"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "documentation/**"
      - "packages/core/examples/**"
      - "packages/http/examples/**"
      - "packages/http-otel/examples/**"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  # Pages publishing is temporarily disabled.
  # pages: write
  # id-token: write

concurrency:
  group: documentation
  # group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify embedded snippets are in sync
        run: bun documentation/build.ts --check

      - name: Build site
        run: bun run documentation:build:html

      # Pages publishing is temporarily disabled. Re-enable these steps and
      # the deploy job below when documentation hosting should resume.
      # - uses: actions/configure-pages@v5
      #
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: documentation/.vitepress/dist

