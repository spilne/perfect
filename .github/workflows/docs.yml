name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "packages/core/examples/**"
      - "packages/http/examples/**"
      - "packages/http-otel/examples/**"
      - "templates/stackblitz/**"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "documentation/**"
      - "packages/core/examples/**"
      - "packages/http/examples/**"
      - "packages/http-otel/examples/**"
      - "templates/stackblitz/**"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages allows one in-flight deployment; queue rather than cancel so a
  # merge train cannot leave the site built from an older commit.
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify embedded snippets are in sync
        run: bun documentation/build.ts --check

      - name: Build site
        run: bun run documentation:build:html

      # Only upload from main. A PR still builds the site above, so breakage is
      # caught before merge, but must not be able to publish it.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: documentation/.vitepress/dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
