name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "packages/core/examples/**"
      - "packages/http/examples/**"
      - "packages/http-otel/examples/**"
      - "templates/stackblitz/**"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "documentation/**"
      - "packages/core/examples/**"
      - "packages/http/examples/**"
      - "packages/http-otel/examples/**"
      - "templates/stackblitz/**"
      - "packages/*/README.md"
      - "packages/*/package.json"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Shared with release.yml: Pages allows one in-flight deployment, and
  # cancelling mid-flight can leave the live site built from an older commit.
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify embedded snippets are in sync
        run: bun documentation/build.ts --check

      - name: Build site
        run: bun run documentation:build:html

      # Publishing happens in release.yml, when packages actually publish, so
      # the site always matches the released version rather than whatever last
      # landed on main. These steps run only for a manual dispatch, which is the
      # escape hatch for fixing the live site without cutting a release.
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: documentation/.vitepress/dist

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
