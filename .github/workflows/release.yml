name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  BUN_VERSION: latest

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.NPM_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Must match rust-toolchain.toml and ci.yml. On @stable this step picks up
      # rustc 1.98, where the wasm32-wasip1 link fails on SWC's host imports —
      # release:publish runs build:swc, so the release would break exactly as CI
      # did on 2026-08-23.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-wasip1

      - run: bun install --frozen-lockfile

      - run: bun run ci

      - name: Create version PR or publish packages
        uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
