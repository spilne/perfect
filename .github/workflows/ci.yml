name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "templates/**"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".oxlintrc.json"
      - "package.json"
      - "bun.lock"
      - "nx.json"
      - "rust-toolchain.toml"
      - "tsconfig.package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: latest
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'templates/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run fmt:check

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test --recursive packages/

      - run: bun run build:packages

      - run: bun run smoke:packages

      - run: bun run smoke:stackblitz

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/swc-plugin-perfect -> target

      - run: cargo test --locked
        working-directory: crates/swc-plugin-perfect

      - run: cargo build --locked --target wasm32-wasip1 --release
        working-directory: crates/swc-plugin-perfect

      - run: mkdir -p packages/swc-plugin/dist

      - run: cp crates/swc-plugin-perfect/target/wasm32-wasip1/release/swc_plugin_perfect.wasm packages/swc-plugin/dist/plugin.wasm

      - name: Check wasm artifact
        run: test -s packages/swc-plugin/dist/plugin.wasm && ls -la packages/swc-plugin/dist/plugin.wasm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Wasm e2e — fixture corpus through the real SWC pipeline
        run: bun test test/swc-e2e.test.ts
        working-directory: packages/transform

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'templates/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Generate performance report
        run: bun run perf:report

      - name: Run performance gate
        run: bun run perf:gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: .perf/
