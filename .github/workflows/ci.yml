name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    paths:
      - "packages/**"
      - "templates/**"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".oxlintrc.json"
      - "package.json"
      - "bun.lock"
      - "nx.json"
      - "rust-toolchain.toml"
      - "tsconfig.package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: latest
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'templates/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run fmt:check

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test --recursive packages/
      - run: bun run test:coverage

      - name: Upload Bun coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-coverage-${{ github.run_id }}
          path: coverage/bun
          if-no-files-found: ignore

      - run: bun run build:packages

      - run: bun run smoke:packages

      - run: bun run smoke:stackblitz

  node-runtime:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    runs-on: macos-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'templates/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run test:node:coverage -- --coverage-dir=coverage/node/${{ matrix.node-version }}

      - name: Upload Node coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-coverage-${{ matrix.node-version }}-${{ github.run_id }}
          path: coverage/node/${{ matrix.node-version }}
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/swc-plugin-perfect -> target

      - run: cargo test --locked
        working-directory: crates/swc-plugin-perfect

      - run: cargo build --locked --target wasm32-wasip1 --release
        working-directory: crates/swc-plugin-perfect

      - run: mkdir -p packages/swc-plugin/dist

      - run: cp crates/swc-plugin-perfect/target/wasm32-wasip1/release/swc_plugin_perfect.wasm packages/swc-plugin/dist/plugin.wasm

      - name: Check wasm artifact
        run: test -s packages/swc-plugin/dist/plugin.wasm && ls -la packages/swc-plugin/dist/plugin.wasm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Wasm e2e — fixture corpus through the real SWC pipeline
        run: bun test test/swc-e2e.test.ts
        working-directory: packages/transform

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline is measured from a worktree of another commit, so the
          # full history has to be present.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'templates/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Informational: the mitata report against effect-ts. Kept from the
      # previous job shape; never fatal, since it gates nothing.
      - name: Comparative report vs effect-ts
        continue-on-error: true
        run: bun run perf:report

      - name: Absolute gate (catastrophic floor)
        run: bun run perf:gate

      - name: Resolve baseline commit
        id: baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Merge-base, not the base tip: comparing against a base that moved
            # on would attribute other people's changes to this PR.
            ref=$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}")
          else
            ref=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi
          if [ -z "$ref" ] || [ "$ref" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Baseline comparison
        if: steps.baseline.outputs.skip == 'false'
        run: bun run perf:compare --baseline "${{ steps.baseline.outputs.ref }}" --rounds 3

      - name: Comment the comparison on the PR
        # Fork PRs get a read-only token, so skip rather than fail. Never fatal:
        # a commenting problem must not mask the gate's own verdict.
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.baseline.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f .perf/compare.md ] || exit 0
          printf '<!-- perfect-perf-report -->\n\n' > .perf/comment.md
          cat .perf/compare.md >> .perf/comment.md
          pr=${{ github.event.pull_request.number }}
          existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            --jq 'map(select(.body | startswith("<!-- perfect-perf-report -->"))) | .[0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@.perf/comment.md >/dev/null
          else
            gh pr comment "$pr" --body-file .perf/comment.md >/dev/null
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          # `.perf` is a HIDDEN directory, and upload-artifact ignores anything
          # inside a folder beginning with "." unless told otherwise. That, not
          # the glob, is why the artifact was never created and
          # performance-history reported "Artifact not found" while this step
          # showed green. Explicit globs also keep the baseline worktree out.
          include-hidden-files: true
          path: |
            .perf/*.json
            .perf/*.md
          if-no-files-found: error

  # Trend record. The comparison gate catches one bad commit; it cannot see a
  # 3% regression repeated ten times, where every step is inside tolerance but
  # the total is not. Runs only on main so the series is one comparable line.
  performance-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: performance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Reuse the numbers the performance job already measured rather than
      # re-running the suites — a second measurement would be a different
      # sample and make the series noisier for no benefit.
      # Not fatal: the recording script already no-ops when there are no
      # results, and a missing artifact must not fail a push to main.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: perf
          path: .perf

      - name: Append to the history branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -f .perf/current.json ] || { echo "no results to record"; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin perf-history >/dev/null 2>&1; then
            git fetch origin perf-history --depth=1
            git worktree add ../perf-history origin/perf-history
          else
            git worktree add --detach ../perf-history
            git -C ../perf-history checkout --orphan perf-history
            git -C ../perf-history rm -rf . >/dev/null 2>&1 || true
          fi

          bun scripts/perf/history.ts --results .perf/current.json --dir ../perf-history

          cd ../perf-history
          git add history.jsonl README.md
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -m "perf: record ${GITHUB_SHA:0:8}"
          git push origin HEAD:perf-history
