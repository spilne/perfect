# Back to floating `stable` as of 2026-08-23.
#
# History worth keeping: this was briefly pinned to 1.90.0 because CI's stable
# reached 1.98.0 and the wasm32-wasip1 link began rejecting SWC's host imports
# (`undefined symbol: __set_transform_result`). The real cause was swc_core 63,
# which predates that linker behaviour. Upgrading to swc_core 77 fixed it at the
# source — verified by building this crate on 1.98.0, which links cleanly.
#
# If that error ever returns, it means swc_core has fallen behind the toolchain
# again. Upgrade swc_core rather than pinning rustc, and remember the JS-side
# @swc/core must move with it: the plugin runner refuses a plugin built against
# an incompatible swc_core.
[toolchain]
channel = "stable"
profile = "minimal"
targets = ["wasm32-wasip1"]
